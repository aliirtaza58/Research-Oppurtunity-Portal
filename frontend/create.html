<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Post New Opportunity</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🎓 Research Opportunity Portal</a>
    </div>
  </nav>

  <div class="container mt-4" style="max-width: 700px;">
    <a href="index.html" class="btn btn-outline-secondary btn-sm mb-3">← Back to List</a>
    <h4 class="mb-3">Post a New Research Opportunity</h4>
    <div id="alert-box"></div>
    <form id="create-form" novalidate>
      <div class="mb-3">
        <label class="form-label">Research Title <span class="text-danger">*</span></label>
        <input type="text" id="title" class="form-control" placeholder="e.g. AI in Healthcare" required/>
        <div class="invalid-feedback">Title is required.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Description <span class="text-danger">*</span></label>
        <textarea id="description" class="form-control" rows="3" placeholder="Describe the research opportunity..." required></textarea>
        <div class="invalid-feedback">Description is required.</div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Research Area <span class="text-danger">*</span></label>
          <input type="text" id="research_area" class="form-control" placeholder="e.g. Machine Learning" required/>
          <div class="invalid-feedback">Research area is required.</div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Faculty Name <span class="text-danger">*</span></label>
          <input type="text" id="faculty_name" class="form-control" placeholder="e.g. Dr. Ahmed Khan" required/>
          <div class="invalid-feedback">Faculty name is required.</div>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Department <span class="text-danger">*</span></label>
          <input type="text" id="department" class="form-control" placeholder="e.g. Computer Science" required/>
          <div class="invalid-feedback">Department is required.</div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Available Positions <span class="text-danger">*</span></label>
          <input type="number" id="available_positions" class="form-control" min="1" placeholder="e.g. 3" required/>
          <div class="invalid-feedback">Must be a positive number.</div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Required Skills <span class="text-danger">*</span></label>
        <input type="text" id="required_skills" class="form-control" placeholder="e.g. Python, TensorFlow, Data Analysis" required/>
        <div class="invalid-feedback">Required skills are required.</div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Application Deadline <span class="text-danger">*</span></label>
          <input type="date" id="application_deadline" class="form-control" required/>
          <div class="invalid-feedback">Deadline is required.</div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Status</label>
          <select id="status" class="form-select">
            <option value="Open" selected>Open</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Post Opportunity</button>
    </form>
  </div>

  <script src="js/create.js"></script>
</body>
</html>
