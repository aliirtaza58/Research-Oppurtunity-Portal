<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Research Opportunity Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🎓 Research Opportunity Portal</a>
      <a href="create.html" class="btn btn-light btn-sm">+ Post Opportunity</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h4 class="mb-3">All Research Opportunities</h4>
    <div id="alert-box"></div>
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Loading opportunities...</p>
    </div>
    <div id="no-data" class="alert alert-info d-none">No research opportunities found. Be the first to post one!</div>
    <div id="opportunities-list" class="row g-3"></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
