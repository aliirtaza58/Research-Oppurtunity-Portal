<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Opportunity Details</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🎓 Research Opportunity Portal</a>
    </div>
  </nav>

  <div class="container mt-4">
    <a href="index.html" class="btn btn-outline-secondary btn-sm mb-3">← Back to List</a>
    <div id="alert-box"></div>
    <div id="loading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>
    <div id="detail-card" class="d-none">
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h5 id="detail-title" class="mb-0"></h5>
          <span id="detail-status" class="badge fs-6"></span>
        </div>
        <div class="card-body">
          <div class="row mb-2">
            <div class="col-md-6"><strong>Faculty:</strong> <span id="detail-faculty"></span></div>
            <div class="col-md-6"><strong>Department:</strong> <span id="detail-department"></span></div>
          </div>
          <div class="row mb-2">
            <div class="col-md-6"><strong>Research Area:</strong> <span id="detail-area"></span></div>
            <div class="col-md-6"><strong>Available Positions:</strong> <span id="detail-positions"></span></div>
          </div>
          <div class="mb-2"><strong>Application Deadline:</strong> <span id="detail-deadline"></span></div>
          <div class="mb-2"><strong>Required Skills:</strong> <span id="detail-skills"></span></div>
          <div class="mb-3"><strong>Description:</strong>
            <p id="detail-description" class="mt-1"></p>
          </div>
          <div class="d-flex gap-2 flex-wrap">
            <a id="edit-btn" href="#" class="btn btn-warning">✏️ Edit</a>
            <button id="close-btn" class="btn btn-secondary">🔒 Mark as Closed</button>
            <button id="delete-btn" class="btn btn-danger">🗑️ Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/detail.js"></script>
</body>
</html>
